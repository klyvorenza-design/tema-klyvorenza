:is(#kvz-hub,#kvz-pop) .kvz-check label{font-size:.88rem;line-height:1.45;color:var(--kvz-text);padding:10px 0;cursor:pointer;margin:0;font-weight:400}
:is(#kvz-hub,#kvz-pop) .kvz-check a{color:var(--kvz-accent);text-decoration:underline;text-underline-offset:2px;font-weight:600}

:is(#kvz-hub,#kvz-pop) .kvz-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;padding:12px 22px;border:0;border-radius:999px;background:var(--kvz-grad-deep);color:var(--kvz-on-grad);font-size:1rem;font-weight:700;line-height:1.2;cursor:pointer;box-shadow:0 6px 16px rgba(11,127,116,.25);transition:filter .2s,transform .2s,box-shadow .2s}
:is(#kvz-hub,#kvz-pop) .kvz-btn:hover{filter:brightness(1.08);color:var(--kvz-on-grad)}
:is(#kvz-hub,#kvz-pop) .kvz-btn:active{transform:translateY(1px)}
:is(#kvz-hub,#kvz-pop) .kvz-btn[disabled]{cursor:progress;opacity:.85;filter:none}
:is(#kvz-hub,#kvz-pop) .kvz-btn__spin{display:none;width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent}

/* ===== Pop-up flutuante (sem overlay: a página continua rolando) ===== */
#kvz-pop{position:fixed;right:16px;bottom:16px;z-index:100000;width:min(400px,calc(100vw - 32px));max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;padding:22px 22px 20px;background:var(--kvz-card);color:var(--kvz-text);font:inherit;font-size:16px;line-height:1.5;border:2px solid transparent;border-radius:24px;background:linear-gradient(var(--kvz-card),var(--kvz-card)) padding-box,var(--kvz-grad) border-box;box-shadow:0 18px 50px rgba(0,0,0,.28)}
#kvz-pop:focus{outline:none}
#kvz-pop .kvz-pop__close{position:absolute;top:6px;right:6px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;margin:0;border:0;border-radius:50%;background:transparent;color:var(--kvz-text);cursor:pointer}

@media (max-width:359px){#kvz-pop{padding-left:14px;padding-right:14px}}
</style>
<script id="kvz-pop-script">
(function () {
'use strict';
/* =====================================================================
   CONFIGURAÇÃO — mexa só aqui (os mesmos valores devem estar nos dois blocos:
   página do hub e pop-up global)
   ===================================================================== */
var CONFIG = {
  /* Logo da marca (newsletter e pop-up). Já está na biblioteca de mídia do site.
     Para trocar: envie a imagem em Mídia > Adicionar e cole a URL do arquivo aqui. */
  LOGO_URL: 'https://klyvorenza.com/wp-content/uploads/2026/11/Logo-Klyvorenza-1.png',
  BRAND_NAME: 'klyvorenza',
  PRIVACY_URL: 'https://klyvorenza.com/politica-de-privacidade/',
  /* ENVIO DA NEWSLETTER — uma única variável.
     Cole aqui a URL/action do seu serviço (Brevo, Mailchimp, MailerLite, plugin do WordPress etc.).
     Os dados vão por POST (application/x-www-form-urlencoded) com os campos abaixo.
     Se o seu serviço usa outros nomes de campo (ex.: Mailchimp usa FNAME e EMAIL), troque em NEWSLETTER_FIELDS.
     Campos fixos do serviço (ex.: lista, token) vão em NEWSLETTER_EXTRA.
     Serviços que não liberam CORS (Mailchimp, formulários HTML simples): use NEWSLETTER_NO_CORS: true
     (o envio acontece, mas o navegador não consegue ler a resposta; o site assume sucesso). */
  NEWSLETTER_ENDPOINT: '',
  NEWSLETTER_FIELDS: { name: 'name', email: 'email' },
  NEWSLETTER_EXTRA: {},
  NEWSLETTER_NO_CORS: false,
  /* MODO ESCURO — Ashe Pro: classe no <body> e chave do localStorage do botão de lua do tema.
     (Confirmado no site: body.ashe-dark-mode e localStorage.asheDarkMode = 'on' | 'off'.)
     Se o tema mudar, troque só estas duas linhas. */
  DARK_BODY_CLASS: 'ashe-dark-mode',
  DARK_STORAGE_KEY: 'asheDarkMode',
  FOLLOW_OS_DARK: true, /* true = sem escolha no botão do tema, segue prefers-color-scheme */
  /* POP-UP */
  POPUP_DELAY_MS: 3000,
  STORAGE_KEY_DISMISSED: 'kvz_news_dismissed',   /* guarda a data local (AAAA-MM-DD) em que foi fechado */
  STORAGE_KEY_SUBSCRIBED: 'kvz_news_subscribed', /* guarda o timestamp até quando não deve aparecer (1 ano) */
  SUBSCRIBED_DAYS: 365
};
var doc = document;
function el(tag, cls, text) { var e = doc.createElement(tag); if (cls) { e.className = cls; } if (text != null) { e.textContent = text; } return e; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function onReady(fn) { if (doc.readyState === 'loading') { doc.addEventListener('DOMContentLoaded', fn); } else { fn(); } }
function reduced() { return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); }
/* ---------- Tema claro/escuro ---------- */
function isDark() {
  if (doc.body && doc.body.classList.contains(CONFIG.DARK_BODY_CLASS)) { return true; }
  var pref = null;
  try { pref = localStorage.getItem(CONFIG.DARK_STORAGE_KEY); } catch (e) {}
  if (pref === 'off') { return false; }
  if (pref === 'on') { return true; }
  return !!(CONFIG.FOLLOW_OS_DARK && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}
function paintTheme() {
  var t = isDark() ? 'dark' : 'light';
  Array.prototype.forEach.call(doc.querySelectorAll('#kvz-hub, #kvz-pop'), function (n) { if (n.getAttribute('data-kvz-theme') !== t) { n.setAttribute('data-kvz-theme', t); } });
}
function watchTheme() {
  paintTheme();
  if (window.MutationObserver && doc.body) { new MutationObserver(paintTheme).observe(doc.body, { attributes: true, attributeFilter: ['class'] }); }
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) { mq.addEventListener('change', paintTheme); } else if (mq.addListener) { mq.addListener(paintTheme); }
  }
  window.addEventListener('storage', function (e) { if (e.key === CONFIG.DARK_STORAGE_KEY) { paintTheme(); } });
}
/* ---------- Armazenamento: localStorage, com cookie como alternativa ---------- */
var LS = (function () { try { var k = '__kvz_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })();
function cookieGet(k) { var m = doc.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; }
function cookieSet(k, v, days) { doc.cookie = k + '=' + encodeURIComponent(v) + '; max-age=' + Math.round(days * 86400) + '; path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : ''); }
function store(k, v, days) { if (LS) { try { localStorage.setItem(k, v); return; } catch (e) {} } cookieSet(k, v, days); }
function read(k) { var v = null; if (LS) { try { v = localStorage.getItem(k); } catch (e) {} } return v !== null ? v : cookieGet(k); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); } /* data LOCAL */
function isSubscribed() { var t = parseInt(read(CONFIG.STORAGE_KEY_SUBSCRIBED), 10); return !!t && t > Date.now(); }
function markSubscribed() { store(CONFIG.STORAGE_KEY_SUBSCRIBED, String(Date.now() + CONFIG.SUBSCRIBED_DAYS * 864e5), CONFIG.SUBSCRIBED_DAYS); }
function markDismissed() { store(CONFIG.STORAGE_KEY_DISMISSED, today(), 2); }
function mayShowPopup() { return !isSubscribed() && read(CONFIG.STORAGE_KEY_DISMISSED) !== today(); }
/* ---------- Newsletter: markup + validação + envio ---------- */
function newsletterMarkup(p, eager) {
  return '<div class="kvz-brand"><img class="kvz-brand__logo" src="' + esc(CONFIG.LOGO_URL) + '" alt="Logo da Klyvorenza" width="72" height="72" decoding="async" ' + (eager ? 'fetchpriority="high"' : 'loading="lazy"') + '><p class="kvz-brand__name">' + esc(CONFIG.BRAND_NAME) + '</p></div>' +
    '<p class="kvz-lead">Receba dicas de moda e beleza no seu e-mail.</p>' +
    '<form class="kvz-form" novalidate method="post" data-state="idle">' +
    '<div class="kvz-field"><label for="' + p + '-nome">Nome <span aria-hidden="true">*</span></label><input id="' + p + '-nome" data-f="name" type="text" required minlength="2" maxlength="80" autocomplete="given-name" aria-describedby="' + p + '-nome-e"><p class="kvz-err" id="' + p + '-nome-e" hidden></p></div>' +
    '<div class="kvz-field"><label for="' + p + '-email">E-mail <span aria-hidden="true">*</span></label><input id="' + p + '-email" data-f="email" type="email" required maxlength="120" autocomplete="email" inputmode="email" aria-describedby="' + p + '-email-e"><p class="kvz-err" id="' + p + '-email-e" hidden></p></div>' +
    '<div class="kvz-hp" aria-hidden="true"><label>Não preencha este campo<input data-f="hp" type="text" tabindex="-1" autocomplete="off"></label></div>' +
    '<div class="kvz-field"><div class="kvz-check"><input id="' + p + '-ok" data-f="consent" type="checkbox" required aria-describedby="' + p + '-ok-e"><label for="' + p + '-ok">Concordo em receber e-mails da Klyvorenza e aceito a <a href="' + esc(CONFIG.PRIVACY_URL) + '" target="_blank" rel="noopener">Política de Privacidade</a> (LGPD). <span aria-hidden="true">*</span></label></div><p class="kvz-err" id="' + p + '-ok-e" hidden></p></div>' +
    '<button type="submit" class="kvz-btn"><span class="kvz-btn__label">Quero receber</span><span class="kvz-btn__spin" aria-hidden="true"></span></button>' +
    '<p class="kvz-status" role="status" aria-live="polite"></p></form>';
}
function sendNewsletter(name, email) {
  var ep = CONFIG.NEWSLETTER_ENDPOINT;
  if (!ep) { return Promise.reject(new Error('NOT_CONFIGURED')); }
  var body = new URLSearchParams();
  body.set(CONFIG.NEWSLETTER_FIELDS.name, name);
  body.set(CONFIG.NEWSLETTER_FIELDS.email, email);
  Object.keys(CONFIG.NEWSLETTER_EXTRA).forEach(function (k) { body.set(k, CONFIG.NEWSLETTER_EXTRA[k]); });
  var opts = { method: 'POST', body: body, credentials: 'omit' };
  if (CONFIG.NEWSLETTER_NO_CORS) { opts.mode = 'no-cors'; }
  return fetch(ep, opts).then(function (r) { if (!CONFIG.NEWSLETTER_NO_CORS && !r.ok) { throw new Error('HTTP ' + r.status); } return true; });
}
/* Liga a validação e o envio ao <form>. onSuccess roda depois de um envio bem-sucedido. */
function wireForm(form, onSuccess) {
  var f = {}, err = {}, btn = form.querySelector('.kvz-btn'), label = form.querySelector('.kvz-btn__label'), status = form.querySelector('.kvz-status');
  ['name', 'email', 'consent', 'hp'].forEach(function (k) { f[k] = form.querySelector('[data-f="' + k + '"]'); });
  ['name', 'email', 'consent'].forEach(function (k) { err[k] = doc.getElementById(f[k].getAttribute('aria-describedby')); });
  function message(k) {
    var v = (f[k].value || '').trim();
    if (k === 'name') { return !v ? 'Informe seu nome.' : (v.length < 2 ? 'O nome precisa ter pelo menos 2 letras.' : ''); }
    if (k === 'email') { return !v ? 'Informe seu e-mail.' : ((f[k].validity.typeMismatch || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) ? 'Digite um e-mail válido, por exemplo: nome@exemplo.com.' : ''); }
    return f[k].checked ? '' : 'Para continuar, aceite receber e-mails e a Política de Privacidade.';
  }
  function check(k) { var m = message(k); f[k].setAttribute('aria-invalid', m ? 'true' : 'false'); err[k].textContent = m; err[k].hidden = !m; return m; }
  function setStatus(text, kind) { status.textContent = text; status.className = 'kvz-status' + (kind ? ' is-' + kind : ''); }
  function setState(s, text) {
    form.setAttribute('data-state', s); btn.disabled = (s === 'loading' || s === 'success'); btn.setAttribute('aria-busy', s === 'loading' ? 'true' : 'false');
    label.textContent = ({ idle: 'Quero receber', loading: 'Enviando…', success: 'Inscrição realizada', error: 'Tentar novamente' })[s];
  }
  ['name', 'email'].forEach(function (k) {
    f[k].addEventListener('blur', function () { if (f[k].value) { check(k); } });
    f[k].addEventListener('input', function () { if (f[k].getAttribute('aria-invalid') === 'true') { check(k); } });
  });
  f.consent.addEventListener('change', function () { check('consent'); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (form.getAttribute('data-state') === 'loading') { return; }
    var bad = ['name', 'email', 'consent'].filter(check);
    if (bad.length) { setStatus('Revise os campos destacados.', 'error'); f[bad[0]].focus(); return; }
    if (f.hp.value) { setState('success'); setStatus('Inscrição realizada! Obrigada por se juntar à Klyvorenza.', 'ok'); return; } /* robô */
    setState('loading'); setStatus('Enviando seus dados…', '');
    sendNewsletter(f.name.value.trim(), f.email.value.trim()).then(function () {
      markSubscribed(); form.reset(); setState('success'); setStatus('Inscrição realizada! Obrigada por se juntar à Klyvorenza.', 'ok');
      if (onSuccess) { onSuccess(); }
    }).catch(function (er) {
      setState('error');
